[package]
name = "server"
version = "1.0.2"
edition = "2021"
description = "RiscDom control plane: HTTP + SSE over the host's kernel facade (Layer 3)"

# This repository is the control plane as a program (v1.0 M8-4a). It is a workspace
# of its own, and it takes the kernel as a **git dependency pinned to a tag**
# (docs/server-distribution.md; the kernel's docs/multi-repo.md §2).
[workspace]

[[bin]]
name = "riscdom-server"
path = "src/main.rs"

[lib]
name = "server"
path = "src/lib.rs"

[dependencies]
# Layer 3 depends only on Layer 2's portable half (`host-core`), never on a Tauri
# type. In this repository it is the kernel at the tag this program was cut from:
# `v1.0.0` (the first tag that carries the connection layer, the backup tool and the
# SDK). `Cargo.lock` is committed and is the real pin — a tag can move, a committed
# lock cannot.
host-core = { git = "https://github.com/breakevery/riscdom", tag = "v1.0.0" }
# The HTTP/1.1 server. The `server` feature is what pulls `httpdate`.
hyper = { version = "1", features = ["server", "http1"] }
# Only the IO driver and the broadcast channel are needed: no timer feature, so
# the heartbeat runs on its own thread instead of a tokio interval.
tokio = { version = "1", features = ["net", "rt", "io-util", "sync"] }
# The stream-to-body bridge for the SSE response (`StreamBody`), the fixed-size
# body (`Full`) and `BoxBody`. `futures-util` supplies `stream::unfold`.
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The bearer token's random source and its constant-time comparison.
getrandom = "0.4"
subtle = "2"

[dev-dependencies]
# The connection layer's own types, so a test can seed `node.key`, `peers.json` and
# `rooms.json` exactly as a host writes them rather than hand-writing JSON that must
# still parse. Same kernel, same tag.
net = { git = "https://github.com/breakevery/riscdom", tag = "v1.0.0" }
